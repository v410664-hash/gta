name: CI

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          git zip unzip openjdk-17-jdk autoconf automake libtool pkg-config gettext \
          zlib1g-dev libncurses5-dev libncursesw5-dev libffi-dev libssl-dev build-essential wget

    - name: Download and setup NDK manually
      run: |
        wget -q https://dl.google.com/android/repository/android-ndk-r25b-linux.zip
        unzip -q android-ndk-r25b-linux.zip -d /home/runner/
        mv /home/runner/android-ndk-r25b /home/runner/android-ndk

    - name: Install Buildozer and dependencies
      run: |
        python -m pip install --upgrade pip
        pip install "setuptools<66" "cython<3"
        pip install --upgrade git+https://github.com/kivy/python-for-android.git
        pip install --upgrade git+https://github.com/kivy/buildozer.git

    - name: Build Android APK
      run: |
        yes | buildozer -v android debug

    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: bin/*.apk
