name: CI

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: kivy/buildozer:latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Fix git safe directory
      run: |
        git config --global --add safe.directory /__w/gta/gta

    - name: Update Buildozer and p4a inside container
      run: |
        pip install --upgrade pip
        pip install --upgrade git+https://github.com/kivy/buildozer.git
        pip install --upgrade git+https://github.com/kivy/python-for-android.git

    - name: Build with Buildozer
      run: |
        rm -rf .buildozer bin
        echo "y" | buildozer -v android debug

    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: bin/*.apk
