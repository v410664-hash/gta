name: Автоматична збірка APK БЗВП

on:
  push:
    branches: [ master, main, головний ]

jobs:
  build:
    runs-on: ubuntu-20.04

    steps:
    - name: 1. Клонування коду з репозиторію
      uses: actions/checkout@v3

    - name: 2. Налаштування Java 17
      uses: actions/setup-java@v3
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: 3. Налаштування стабільного Python 3.10
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: 4. Встановлення мобільних системних бібліотек Linux
      run: |
        sudo apt-get update
        sudo apt-get install -y git zip unzip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libssl-dev cmake libffi-dev libgstreamer1.0-dev

    - name: 5. Встановлення Cython та Buildozer (Сумісні версії)
      run: |
        pip install --upgrade pip
        pip install "cython<3.0.0" "buildozer==1.5.0"

    - name: 6. Фінальне пакування додатка БЗВП в APK
      run: buildozer android debug

    - name: 7. Видача готового файлу в Артефакти
      uses: actions/upload-artifact@v4
      with:
        name: BZVP-Schedule-APK
        path: bin/*.apk
