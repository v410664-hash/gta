- name: Install stable python-for-android
      run: |
        pip install --upgrade pip
        pip install --upgrade "python-for-android==2023.9.16"

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
            git \
            zip \
            unzip \
            autoconf \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libffi-dev \
            libssl-dev \
            ant \
            openjdk-17-jdk

    - name: Install stable Buildozer and p4a
      run: |
        pip install --upgrade pip
        pip install Cython==3.0.10
        pip install buildozer==1.5.0
        pip install python-for-android==2023.09.0

    - name: Build with Buildozer
      env:
        ANDROID_NDK_HOME: /usr/local/lib/android/sdk/ndk/25.2.9519653
        ANDROIDNDK: /usr/local/lib/android/sdk/ndk/25.2.9519653
        JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64
      run: |
        buildozer -v android debug

    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: bin/*.apk
